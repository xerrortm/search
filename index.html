<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XSearch - Modern Search Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .transition-theme {
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-theme flex flex-col min-h-screen">
  <header class="w-full px-4 sm:px-8 py-4 flex items-center justify-between border-b border-transparent dark:border-transparent transition-colors z-20">
    <a href="#" onclick="resetToHome(event)" class="group flex items-center gap-2 focus:outline-none">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
        X
      </div>
      <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white hidden sm:inline-block">
        XSearch
      </span>
    </a>
    <button
      id="theme-toggle"
      onclick="toggleTheme()"
      type="button"
      aria-label="Toggle light and dark mode"
      class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all shadow-sm"
    >
      <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg id="moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </header>
  <main class="flex-1 flex flex-col items-center w-full px-4 sm:px-6">
    <div id="hero-view" class="flex-1 flex flex-col items-center justify-center w-full max-w-2xl py-12 my-auto">
      <div class="text-center mb-8 space-y-3">
        <h1 class="text-5xl sm:text-6xl font-extrabold tracking-tight text-slate-900 dark:text-white">
          <span class="bg-gradient-to-r from-brand-600 via-indigo-600 to-sky-400 bg-clip-text text-transparent">XSearch</span>
        </h1>
        <p class="text-slate-500 dark:text-slate-400 text-base sm:text-lg font-normal">
          Search the web with speed and precision.
        </p>
      </div>
      <div class="w-full relative group">
        <form onsubmit="handleSearch(event, 'hero')" class="relative flex items-center">
          <div class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 group-focus-within:text-brand-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input
            type="text"
            id="hero-search-input"
            placeholder="Search anything..."
            autocomplete="off"
            autofocus
            oninput="handleInputChange('hero')"
            class="w-full pl-14 pr-28 py-4 text-base sm:text-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-lg shadow-slate-200/50 dark:shadow-none text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200"
          />
          <div class="absolute right-3 flex items-center gap-1.5">
            <button
              type="button"
              onclick="clearInput('hero')"
              id="hero-clear-btn"
              title="Clear input"
              class="hidden p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg transition-colors"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <button
              type="button"
              onclick="toggleVoiceSearch('hero')"
              id="hero-mic-btn"
              title="Search with voice"
              class="p-2.5 text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
              </svg>
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm rounded-xl shadow-md shadow-brand-500/20 transition-all focus:outline-none focus:ring-2 focus:ring-brand-500 flex items-center justify-center"
            >
              Search
            </button>
          </div>
        </form>
      </div>
    </div>
    <div id="results-view" class="hidden w-full max-w-4xl py-4 space-y-6">
      <div class="sticky top-4 z-10 bg-slate-50/90 dark:bg-slate-950/90 backdrop-blur-md pt-1 pb-3">
        <form onsubmit="handleSearch(event, 'top')" class="relative flex items-center max-w-3xl">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input
            type="text"
            id="top-search-input"
            placeholder="Search anything..."
            autocomplete="off"
            oninput="handleInputChange('top')"
            class="w-full pl-12 pr-28 py-3 text-base bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all"
          />
          <div class="absolute right-2.5 flex items-center gap-1">
            <button
              type="button"
              onclick="clearInput('top')"
              id="top-clear-btn"
              title="Clear input"
              class="hidden p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <button
              type="button"
              onclick="toggleVoiceSearch('top')"
              id="top-mic-btn"
              title="Search with voice"
              class="p-2 text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 rounded-lg transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
              </svg>
            </button>
            <button
              type="submit"
              class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs sm:text-sm rounded-lg shadow transition-all focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              Search
            </button>
          </div>
        </form>
      </div>
      <div id="results-meta" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 px-1 hidden">
        Showing results for <span id="meta-query" class="font-semibold text-slate-800 dark:text-slate-200"></span>
      </div>
      <div id="loading-state" class="hidden space-y-6 max-w-3xl">
        <div class="p-5 bg-white dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl animate-pulse space-y-3">
          <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/3"></div>
          <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded w-2/3"></div>
          <div class="space-y-2 pt-1">
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div>
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-4/6"></div>
          </div>
        </div>
        <div class="p-5 bg-white dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl animate-pulse space-y-3">
          <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div>
          <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded w-1/2"></div>
          <div class="space-y-2 pt-1">
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-11/12"></div>
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
          </div>
        </div>
        <div class="p-5 bg-white dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl animate-pulse space-y-3">
          <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-2/5"></div>
          <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded w-3/5"></div>
          <div class="space-y-2 pt-1">
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
            <div class="h-3.5 bg-slate-200 dark:bg-slate-800 rounded w-4/5"></div>
          </div>
        </div>
      </div>
      <div id="error-state" class="hidden p-6 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 rounded-2xl text-center max-w-2xl mx-auto space-y-3">
        <div class="w-12 h-12 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <h3 class="text-lg font-semibold text-red-800 dark:text-red-200" id="error-title">Unable to complete search</h3>
        <p class="text-sm text-red-600 dark:text-red-300 max-w-md mx-auto" id="error-message">Something went wrong while fetching search results. Please try again.</p>
        <button onclick="retrySearch()" class="inline-flex items-center gap-1.5 px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded-xl transition-colors shadow">
          Try Again
        </button>
      </div>
      <div id="empty-state" class="hidden p-12 text-center max-w-md mx-auto space-y-3">
        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800/80 text-slate-400 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200">No results found</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400">We couldn't find anything matching your query. Try checking for typos or using different keywords.</p>
      </div>
      <div id="results-list" class="space-y-4 max-w-3xl"></div>
    </div>
  </main>
  <script>
    const API_ENDPOINT = 'https://search.xerrortm.workers.dev/search?q=';
    let currentQuery = '';
    let isListening = false;
    let recognition = null;
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      checkUrlQuery();
      setupSpeechRecognition();
    });
    function checkUrlQuery() {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      if (query && query.trim()) {
        executeSearch(query.trim());
      }
    }
    function initTheme() {
      const savedTheme = localStorage.getItem('xsearch_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.getElementById('sun-icon').classList.remove('hidden');
        document.getElementById('moon-icon').classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('sun-icon').classList.add('hidden');
        document.getElementById('moon-icon').classList.remove('hidden');
      }
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('xsearch_theme', isDark ? 'dark' : 'light');
      if (isDark) {
        document.getElementById('sun-icon').classList.remove('hidden');
        document.getElementById('moon-icon').classList.add('hidden');
      } else {
        document.getElementById('sun-icon').classList.add('hidden');
        document.getElementById('moon-icon').classList.remove('hidden');
      }
    }
    function showResultsView() {
      document.getElementById('hero-view').classList.add('hidden');
      document.getElementById('results-view').classList.remove('hidden');
    }
    function resetToHome(e) {
      if (e) e.preventDefault();
      currentQuery = '';
      document.getElementById('hero-search-input').value = '';
      document.getElementById('top-search-input').value = '';
      clearInput('hero');
      clearInput('top');
      document.getElementById('results-view').classList.add('hidden');
      document.getElementById('hero-view').classList.remove('hidden');
      try {
        window.history.pushState({}, '', window.location.pathname);
      } catch (e) {
        console.warn('Browser history update skipped in sandboxed environment:', e);
      }
      setTimeout(() => {
        document.getElementById('hero-search-input').focus();
      }, 100);
    }
    function handleInputChange(source) {
      const input = document.getElementById(`${source}-search-input`);
      const clearBtn = document.getElementById(`${source}-clear-btn`);
      if (input.value.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }
    function clearInput(source) {
      const input = document.getElementById(`${source}-search-input`);
      input.value = '';
      input.focus();
      document.getElementById(`${source}-clear-btn`).classList.add('hidden');
    }
    function handleSearch(e, source) {
      e.preventDefault();
      const input = document.getElementById(`${source}-search-input`);
      const query = input.value.trim();
      if (query) {
        executeSearch(query);
      }
    }
    function retrySearch() {
      if (currentQuery) {
        executeSearch(currentQuery);
      }
    }
    async function executeSearch(query) {
      currentQuery = query;
      document.getElementById('hero-search-input').value = query;
      document.getElementById('top-search-input').value = query;
      handleInputChange('hero');
      handleInputChange('top');
      try {
        const newUrl = `${window.location.pathname}?q=${encodeURIComponent(query)}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
      } catch (e) {
        console.warn('Browser history update skipped in sandboxed environment:', e);
      }
      showResultsView();
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('results-list').innerHTML = '';
      document.getElementById('results-meta').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('empty-state').classList.add('hidden');
      try {
        const response = await fetch(`${API_ENDPOINT}${encodeURIComponent(query)}`);
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const data = await response.json();
        document.getElementById('loading-state').classList.add('hidden');
        if (!data.results || !Array.isArray(data.results) || data.results.length === 0) {
          document.getElementById('empty-state').classList.remove('hidden');
          return;
        }
        document.getElementById('meta-query').textContent = `"${query}"`;
        document.getElementById('results-meta').classList.remove('hidden');
        renderResults(data.results);
      } catch (err) {
        console.error('Search request failed:', err);
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('error-message').textContent = 'Unable to fetch search results from the worker endpoint. Please check your network connection and try again.';
        document.getElementById('error-state').classList.remove('hidden');
      }
    }
    function renderResults(results) {
      const container = document.getElementById('results-list');
      container.innerHTML = '';
      results.forEach((item, index) => {
        const domain = getDomain(item.url);
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32`;
        const card = document.createElement('div');
        card.className = "p-5 bg-white dark:bg-slate-900/90 border border-slate-200/80 dark:border-slate-800/80 hover:border-slate-300 dark:hover:border-slate-700 rounded-2xl shadow-sm transition-all duration-200 group";
        card.innerHTML = `
          <div class="flex items-center gap-2 mb-1.5">
            <img
              src="${faviconUrl}"
              alt=""
              class="w-4 h-4 rounded-sm object-contain bg-slate-100 dark:bg-slate-800"
              onerror="this.style.display='none'"
            />
            <div class="flex flex-col">
              <span class="text-xs font-medium text-slate-700 dark:text-slate-300 line-clamp-1">${escapeHtml(domain)}</span>
              <span class="text-[11px] text-slate-400 dark:text-slate-500 line-clamp-1">${escapeHtml(item.url)}</span>
            </div>
          </div>
          <h2 class="text-lg sm:text-xl font-semibold leading-snug mb-2">
            <a
              href="${escapeHtml(item.url)}"
              target="_blank"
              rel="noopener noreferrer"
              class="text-brand-600 dark:text-sky-400 hover:text-brand-700 dark:hover:text-sky-300 hover:underline focus:outline-none focus:ring-2 focus:ring-brand-500 rounded"
            >
              ${escapeHtml(item.title || item.url)}
            </a>
          </h2>
          <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed font-normal line-clamp-3">
            ${escapeHtml(item.content || 'No description available for this result.')}
          </p>
        `;
        container.appendChild(card);
      });
    }
    function getDomain(urlString) {
      try {
        const url = new URL(urlString);
        return url.hostname.replace(/^www\./, '');
      } catch (e) {
        return urlString;
      }
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    // Voice Search Capability
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          if (transcript) {
            executeSearch(transcript);
          }
          stopListening();
        };
        recognition.onerror = () => {
          stopListening();
        };
        recognition.onend = () => {
          stopListening();
        };
      } else {
        // Hide mic buttons if speech API isn't supported
        const heroMic = document.getElementById('hero-mic-btn');
        const topMic = document.getElementById('top-mic-btn');
        if (heroMic) heroMic.style.display = 'none';
        if (topMic) topMic.style.display = 'none';
      }
    }
    function toggleVoiceSearch(source) {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
        stopListening();
      } else {
        try {
          recognition.start();
          isListening = true;
          const micBtn = document.getElementById(`${source}-mic-btn`);
          if (micBtn) {
            micBtn.classList.add('text-red-500', 'animate-pulse');
            micBtn.classList.remove('text-slate-400');
          }
        } catch (e) {
          console.error(e);
        }
      }
    }
    function stopListening() {
      isListening = false;
      ['hero', 'top'].forEach(source => {
        const micBtn = document.getElementById(`${source}-mic-btn`);
        if (micBtn) {
          micBtn.classList.remove('text-red-500', 'animate-pulse');
          micBtn.classList.add('text-slate-400');
        }
      });
    }
    // Handle back / forward browser navigation buttons
    window.addEventListener('popstate', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      if (query) {
        executeSearch(query);
      } else {
        resetToHome();
      }
    });
  </script>
</body>
</html>
